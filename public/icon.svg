<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- The app mark: a tanpura's four strings rising out of a kolam lattice.
       The strings are the drone every practice sits on; the kolam is the daily
       ritual. Both are drawn, not lettered, so the icon survives at 32px. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1f3d"/>
      <stop offset="100%" stop-color="#0e1020"/>
    </linearGradient>
    <linearGradient id="string" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8b33d"/>
      <stop offset="55%" stop-color="#c89b4a"/>
      <stop offset="100%" stop-color="#8a6c34"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Four strings, tuned Pa Sa Sa Ṣa: the outer two heavier, as on the instrument. -->
  <g stroke="url(#string)" stroke-linecap="round">
    <line x1="196" y1="120" x2="196" y2="330" stroke-width="9"/>
    <line x1="236" y1="104" x2="236" y2="330" stroke-width="6"/>
    <line x1="276" y1="104" x2="276" y2="330" stroke-width="6"/>
    <line x1="316" y1="120" x2="316" y2="330" stroke-width="9"/>
  </g>

  <!-- Tuning beads. -->
  <g fill="#e8b33d">
    <circle cx="196" cy="112" r="11"/>
    <circle cx="236" cy="96" r="9"/>
    <circle cx="276" cy="96" r="9"/>
    <circle cx="316" cy="112" r="11"/>
  </g>

  <!-- The gourd the strings run over. -->
  <path d="M256 330 C 196 330 158 366 158 402 C 158 438 200 462 256 462 C 312 462 354 438 354 402 C 354 366 316 330 256 330 Z"
        fill="none" stroke="#c89b4a" stroke-width="10"/>
  <ellipse cx="256" cy="360" rx="52" ry="15" fill="#c89b4a" opacity="0.35"/>

  <!-- A sikku kolam chain across the face of the gourd. -->
  <g stroke="#e8b33d" stroke-width="4.5" fill="none" opacity="0.85">
    <path d="M196 404 Q216 380 236 404 Q256 428 276 404 Q296 380 316 404"/>
    <path d="M196 404 Q216 428 236 404 Q256 380 276 404 Q296 428 316 404"/>
  </g>
  <g fill="#f2ede3">
    <circle cx="196" cy="404" r="4.5"/>
    <circle cx="236" cy="404" r="4.5"/>
    <circle cx="276" cy="404" r="4.5"/>
    <circle cx="316" cy="404" r="4.5"/>
  </g>
</svg>
